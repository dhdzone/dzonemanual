<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 체험존 기기 매뉴얼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        /* 기본 변수 설정 */
        :root {
            --font-scale: 1;
        }
        
        body {
            font-family: 'Pretendard', sans-serif;
            -webkit-font-smoothing: antialiased;
            font-size: calc(1rem * var(--font-scale));
        }
        
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .content-box ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .content-box li { margin-bottom: 0.5rem; }
        
        /* 규격화된 제목 스타일 */
        .content-box h2 { font-size: calc(1.5rem * var(--font-scale)); font-weight: bold; color: #1e3a8a; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .content-box h3 { font-size: calc(1.25rem * var(--font-scale)); font-weight: 600; color: #334155; margin-top: 1rem; margin-bottom: 0.5rem; }
        .content-box h4 { font-size: calc(1.125rem * var(--font-scale)); font-weight: 600; color: #475569; margin-top: 0.75rem; margin-bottom: 0.25rem; }
        .content-box p, .content-box li, .content-box strong, .content-box span { font-size: calc(1rem * var(--font-scale)); color: #475569; }
        
        .content-box .text-sm, .content-box .text-xs, .content-box .text-base, .content-box .text-lg, .content-box .text-xl {
            font-size: inherit; 
        }
        
        .highlight { background-color: #fef08a; padding: 0 4px; border-radius: 4px; }
        
        .search-highlight { transition: all 0.3s ease; }
        .search-highlight.active { background-color: #f97316 !important; color: white !important; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.4) !important; border-radius: 4px; }

        /* 사이드바 숨김을 위한 클래스 (부드러운 애니메이션 적용) */
        .sidebar-hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden transition-all duration-300" id="appBody">

    <header class="md:hidden bg-blue-700 text-white p-4 shadow-md z-30 flex flex-col gap-3 shrink-0 sticky top-0">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center">
                <i data-lucide="book-open" class="mr-2"></i> 디지털 체험존
            </h1>
            <div class="flex gap-2">
                <button onclick="toggleSidebar()" class="p-2 bg-blue-600 rounded hover:bg-blue-500 flex items-center text-sm font-semibold transition-colors" aria-label="목차 토글" id="mobileSidebarToggleBtn">
                    목차숨김
                </button>
                <button onclick="changeFontSize(-0.1)" class="p-2 bg-blue-600 rounded hover:bg-blue-500 transition-colors" aria-label="글씨 작게">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button onclick="changeFontSize(0.1)" class="p-2 bg-blue-600 rounded hover:bg-blue-500 transition-colors" aria-label="글씨 크게">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
        <div class="relative">
            <input type="text" id="mobileSearch" placeholder="기기명이나 내용을 검색하세요..." 
                class="w-full p-2.5 pl-10 rounded-lg text-slate-800 text-base focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner">
            <i data-lucide="search" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
        </div>
    </header>

    <aside id="sidebar" class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-[40vh] md:h-full z-20 shrink-0 transition-all duration-300 relative shadow-md md:shadow-none">
        <div class="hidden md:block p-5 bg-blue-700 text-white">
            <div class="flex justify-between items-start mb-4">
                <h1 class="text-2xl font-bold flex items-center">
                    <i data-lucide="book-open" class="mr-2"></i> 디지털 체험존 매뉴얼
                </h1>
            </div>
            <div class="relative">
                <input type="text" id="desktopSearch" placeholder="검색어 입력..." 
                    class="w-full p-3 pl-10 rounded-lg text-slate-800 text-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                <i data-lucide="search" class="absolute left-3 top-3.5 text-slate-400"></i>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-2" id="menuList">
            </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-slate-50 relative flex flex-col transition-all duration-300 scroll-smooth" id="mainContent">
        
        <div class="sticky top-0 z-20 bg-slate-50/90 backdrop-blur border-b border-slate-200 px-4 py-3 md:px-8 hidden md:flex justify-end items-center gap-3 w-full shadow-sm">
            <button onclick="toggleSidebar()" id="sidebarToggleBtnDesktop" class="bg-white text-slate-600 px-4 py-2 rounded shadow-sm border border-slate-200 hover:bg-slate-100 flex items-center font-bold text-sm transition-colors" title="목차 닫기/열기">
                <i data-lucide="panel-left-close" class="w-4 h-4 mr-1.5" id="sidebarIcon"></i>
                <span id="sidebarText">목차숨김</span>
            </button>
            <div class="flex bg-white rounded shadow-sm border border-slate-200 overflow-hidden">
                <button onclick="changeFontSize(-0.1)" class="px-3 py-2 text-slate-600 hover:bg-slate-100 border-r border-slate-200 transition-colors" title="글씨 작게"><i data-lucide="minus" class="w-4 h-4"></i></button>
                <div class="px-3 py-2 text-slate-600 font-semibold flex items-center justify-center bg-slate-50 min-w-[3.5rem] text-sm" id="fontScaleDisplay">100%</div>
                <button onclick="changeFontSize(0.1)" class="px-3 py-2 text-slate-600 hover:bg-slate-100 border-l border-slate-200 transition-colors" title="글씨 크게"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
            <button onclick="toggleFullScreen()" id="fullscreenToggleBtn" class="bg-white text-slate-600 px-4 py-2 rounded shadow-sm border border-slate-200 hover:bg-slate-100 flex items-center font-bold text-sm transition-colors" title="전체화면 전환">
                <i data-lucide="maximize" class="w-4 h-4 mr-1.5" id="fullscreenIcon"></i>
                <span id="fullscreenText">전체화면</span>
            </button>
        </div>

        <div class="p-3 md:p-8 flex-1 w-full">
            <div id="contentArea" class="max-w-4xl w-full mx-auto bg-white rounded-2xl shadow-sm p-4 md:p-10 border border-slate-200 content-box leading-relaxed relative">
                <div class="text-center py-16 md:py-20 text-slate-500">
                    <i data-lucide="pointer" class="w-12 h-12 md:w-16 md:h-16 mx-auto mb-4 text-slate-300"></i>
                    <p class="text-xl md:text-2xl font-bold mb-2">목차에서 매뉴얼을 선택해주세요.</p>
                    <p class="text-base md:text-lg">또는 검색창에서 기기 이름을 검색해 보세요.</p>
                </div>
            </div>
        </div>
    </main>

    <div id="searchNavigator" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-sm shadow-xl border border-blue-200 rounded-full flex items-center px-4 py-2 gap-3 z-50 hidden transition-all duration-300">
        <button onclick="prevHighlight()" class="p-2 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400" title="이전 결과"><i data-lucide="chevron-up" class="w-5 h-5"></i></button>
        <span id="searchMatchCount" class="text-slate-700 font-semibold text-sm whitespace-nowrap min-w-[3rem] text-center">0 / 0</span>
        <button onclick="nextHighlight()" class="p-2 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400" title="다음 결과"><i data-lucide="chevron-down" class="w-5 h-5"></i></button>
        <div class="w-px h-5 bg-slate-300 mx-1"></div>
        <button onclick="clearSearch()" class="p-2 text-rose-500 hover:bg-rose-50 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-rose-400" title="검색 취소"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <script>
        // 매뉴얼 데이터
        const manualData = [
            {
                id: 'setup',
                title: '기기 세팅 방법',
                icon: 'settings',
                content: `
                    <h2>디지털 체험존 기기 세팅 방법</h2>
                    <p class="mb-6 text-slate-600">체험존 운영 시작 전, 각 기기별 올바른 전원 켜기 및 기본 세팅 절차입니다.</p>
                    <div class="space-y-6">

                    <div class="bg-slate-50 p-4 rounded border border-slate-100">
                    <strong class="text-slate-800 block mb-2">▶ 도우미 가이드 영상 시청하기:</strong>
                    <div class="mt-3 rounded-xl overflow-hidden shadow-sm border border-slate-200">
                     <iframe 
                class="w-full aspect-video" 
                src="https://www.youtube.com/embed/lApmqWrD2gM" 
                title="도우미 가이드 영상" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
        </div>
                        <!-- 정보검색대 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="monitor" class="w-5 h-5 mr-2 text-blue-600"></i>가. 정보검색대</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>정보검색대의 하단 문을 개폐하여 PC의 전원(동그라미 버튼)을 누릅니다.</li>
                                <li>모니터의 전원이 켜져있는지 확인합니다.</li>
                                <li>바탕화면이 정상적으로 보이는지 확인합니다.</li>
                            </ul>
                        </div>

                        <!-- 갤럭시 탭 A7 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="tablet" class="w-5 h-5 mr-2 text-blue-600"></i>나. 갤럭시 탭 A7</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>복지관 2층 종합사무실에서 충전이 완료된 갤럭시 탭 A7 2대를 가져옵니다.</li>
                                <li>기기 오른쪽 옆면의 제일 위쪽에 있는 전원 버튼을 길게 눌러 전원을 켭니다.</li>
                                <li>디지털 체험존 중앙 테이블에 화면이 잘 보이게 거치합니다.</li>
                                <li>바탕화면이 정상적으로 보이는지 확인합니다.</li>
                            </ul>
                        </div>

                        <!-- 키오에듀 선반형 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="layout-template" class="w-5 h-5 mr-2 text-blue-600"></i>다. 키오에듀(선반형)</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>벽면에 있는 멀티탭을 켜서 전원을 켭니다.</li>
                                <li>화면이 켜지면 바탕화면에 있는 '키오에듀' 앱을 실행합니다.</li>
                            </ul>
                            <div class="bg-red-50 mt-3 p-3 rounded text-red-700 border border-red-100">
                                <p class="font-bold">※ 주의사항</p>
                                <ul class="list-disc ml-5 mt-1">
                                    <li>화면이 켜지지 않는다면 뒤쪽 문을 개폐하여 가장 왼쪽 검정색 선을 빼고 2초 뒤 다시 연결합니다.</li>
                                    <li>영수증 기기는 블루투스를 통해 연결됩니다. (자세한 내용은 키오에듀 매뉴얼 참고)</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 키오에듀 스탠드형 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="smartphone" class="w-5 h-5 mr-2 text-blue-600"></i>라. 키오에듀(스탠드형)</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>전원 코드를 콘센트에 연결하여 전원을 켭니다.</li>
                                <li>화면이 켜지면 바탕화면에 있는 '키오에듀' 앱을 실행합니다.</li>
                            </ul>
                            <div class="bg-red-50 mt-3 p-3 rounded text-red-700 border border-red-100">
                                <p class="font-bold">※ 주의사항</p>
                                <ul class="list-disc ml-5 mt-1">
                                    <li>영수증 기기는 블루투스를 통해 연결됩니다. (자세한 내용은 키오에듀 매뉴얼 참고)</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 휴대폰 무인 충전함 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="battery-charging" class="w-5 h-5 mr-2 text-blue-600"></i>마. 휴대폰 무인 충전함</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>충전 중인 기기가 있는지 확인합니다. 분실물일 경우 담당자나 디지털 매니저에게 전달합니다.</li>
                                <li>충전 중인 휴대폰이 없는 경우, 문이 정상적으로 열리는지 확인합니다.</li>
                            </ul>
                        </div>

                        <!-- 두리 로봇 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="bot" class="w-5 h-5 mr-2 text-blue-600"></i>바. 두리 로봇</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>복지관 2층 종합사무실에서 충전이 완료된 두리 로봇을 가져옵니다.</li>
                                <li>로봇 등 쪽에 전원 스위치를 'ON'으로 바꿔 전원을 켭니다.</li>
                                <li>디지털 체험존 중앙 테이블에 비치합니다.</li>
                            </ul>
                        </div>

                        <!-- 마이봄 미니 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="cpu" class="w-5 h-5 mr-2 text-blue-600"></i>사. 마이봄 미니</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>복지관 2층 종합사무실에서 충전이 완료된 마이봄 미니 로봇을 가져옵니다.</li>
                                <li>로봇 몸통의 동그란 버튼을 4초간 눌러 전원을 켭니다.</li>
                                <li>디지털 체험존 중앙 테이블에 비치합니다.</li>
                            </ul>
                        </div>

                        <!-- 보미 로봇 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="puzzle" class="w-5 h-5 mr-2 text-blue-600"></i>아. 보미 로봇</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>로봇 좌측면 하단에 동그란 버튼을 눌러 전원을 켭니다.</li>
                                <li>전원이 켜지면, 블록(10개)의 하단에 전원 스위치를 'ON'으로 바꿔 전원을 켭니다.</li>
                                <li>블럭화면에 불이 들어오면, 화면 아래에 'CONNECTION'으로 되어 있는지 확인합니다.</li>
                                <li>게임을 실행하여 블록이 정상적으로 연결되었는지 확인합니다.</li>
                            </ul>
                                <div class="bg-red-50 mt-3 p-3 rounded text-red-700 border border-red-100">
                                <p class="font-bold">※ 주의사항</p>
                                <ul class="list-disc ml-5 mt-1">
                                <li>블럭 화면에 'DISCONNECTION'이 나올 시, 블럭 전원과 보미 로봇 전원을 전부 종료 후 5분 뒤 보미 로봇-블럭 순서로 재시작 합니다.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 씽큐 테이블 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="layout-grid" class="w-5 h-5 mr-2 text-blue-600"></i>자. 씽큐 테이블</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>테이블 하단 모서리에 있는 전원 스위치를 'ㅇ'에서 '|'로 눌러 전원을 켭니다.</li>
                                <li>화면이 켜지고 바탕화면이 보이면 '시니어 콘텐츠'를 실행합니다.</li>
                            </ul>
                                <div class="bg-red-50 mt-3 p-3 rounded text-red-700 border border-red-100">
                                <p class="font-bold">※ 주의사항</p>
                                <ul class="list-disc ml-5 mt-1">
                                <li>화면이 반대로 보일 시, 홈 화면에서 테이블 아래 중앙에 있는 동그란 초록색 버튼을 누르면 화면이 180도 회전 합니다.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 해피 태블릿 -->
                        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 flex items-center"><i data-lucide="tablet-smartphone" class="w-5 h-5 mr-2 text-blue-600"></i>차. 해피 태블릿</h3>
                            <ul class="list-disc ml-6 space-y-2 text-slate-700">
                                <li>복지관 2층 종합사무실에서 충전이 완료된 갤럭시 탭 A7 1대를 가져옵니다.</li>
                                <li>TV의 오른쪽 밑에 전원버튼을 눌러 화면을 켭니다.</li>
                                <li>TV 하단에 태블릿을 거치한 후 충전선을 연결합니다.</li>
                                <li>태블릿의 상단 화면을 아래로 쓸어 내리며 'smart view'를 터치합니다.</li>
                                <li>TV의 이름이 화면에 나오면 터치해서 연결합니다.</li>

                            <h4 class="font-bold text-slate-800 mb-2">5. 밥 주기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 여러 음식 중 손주가 먹고 싶다고 요청한 음식을 기억했다가, 중간 신체 운동 콘텐츠를 마친 후 올바르게 차려내는 방식입니다. (자극 영역: 측두엽/기억력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">손주가 "먹고 싶은 음식이 생겼어요!"라며 보여주는 음식 종류(예: 김밥)를 기억하고 [다음으로]를 누릅니다. 화면에 1분 동안 송출되는 '선자세 운동 영상'을 보며 가볍게 신체 활동을 따라 합니다. 영상이 끝난 후 다시 음식 선택 화면이 나오면, 기억해 두었던 음식을 누르고 [정답확인]을 누릅니다.</p>
                            </div>
                        </div>

                        <!-- 6. 숨바꼭질 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">6. 숨바꼭질</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 캐릭터(손주)가 과수원이나 집안 배경에서 이동하며 숨는 경로와 장소의 순서를 눈으로 기억했다가 차례대로 찾아내는 게임입니다. (자극 영역: 전두엽/기억력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">캐릭터가 정자세에서 몸을 움직여 숨는 장소들과 그 순서를 집중해서 봅니다. 캐릭터의 이동이 완전히 끝나면 화면의 [손주 찾기] 버튼을 누릅니다. 캐릭터가 숨었던 순서에 맞춰 화면 속 장소들(나무, 우물 등)을 손모양 아이콘으로 순서대로 터치한 후 [정답확인]을 누릅니다.</p>
                            </div>
                        </div>

                        <!-- 7. OX 퀴즈 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">7. OX 퀴즈</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 기준이 되는 언어 카테고리(분야)를 먼저 제시받은 후, 연속해서 나타나는 낱말 카드가 해당 카테고리에 속하는지 여부를 OX로 빠르게 판단하는 순발력 훈련입니다. (자극 영역: 두정엽/언어력·판단력·순발력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">화면의 봉투에서 기준 단어 분야(예: 꽃)가 나타나면 잘 기억합니다. 이어서 무작위 단어(예: 말) 카드가 제시되었을 때, 이 단어가 앞서 본 분야에 속하면 [O], 속하지 않으면 [X] 버튼을 신속하게 터치합니다.</p>
                            </div>
                        </div>

                        <!-- 8. 전화 받기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">8. 전화 받기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 로봇 화면에 가상 전화가 걸려오면 통화를 수락하고, 수화기 너머로 상대방이 대화하는 이야기의 맥락과 세부 내용을 기억해 문제를 푸는 대화형 훈련입니다. (자극 영역: 두정엽/언어력·판단력·순발력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">벨이 울리며 "전화가 왔어요!" 팝업이 뜨면 휴대폰 아이콘 속 녹색 [전화받기] 버튼을 누릅니다. 화면에 통화 캐릭터가 나타나며 들려주는 대화 내용을 끝까지 잘 듣고 기억합니다. 통화가 종료된 후 "전화를 건 사람은 누구였어요?"와 같은 객관식 질문이 나오면 알맞은 정답(예: ① 의사, ② 경찰)을 체크한 뒤 [정답확인]을 누릅니다.</p>
                            </div>
                        </div>

                        <!-- 9. 낚시 하기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">9. 낚시 하기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 화면(터치모드) 또는 카메라 제스처 인식(인식모드)을 활용해, 제시된 미션 물고기를 타이밍에 맞춰 낚아채고 릴을 감아 잡아 올리는 신체 복합 인지 훈련입니다. (자극 영역: 측두엽/언어력·판단력·순발력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <ul class="list-disc ml-5 text-slate-700 space-y-2">
                                    <li><strong>터치 모드:</strong> 오늘의 물고기 종류와 마리수(예: 고등어 2마리)를 기억하고 [다음으로]를 누릅니다. 물속 화면에서 빨간색 상자가 깜빡이는 타이밍에 맞춰 낚시바늘을 재빨리 터치해 물고기를 챘습니다. 상단 시간 막대가 다 차기 전에 우측의 낚싯대 손잡이 릴 아이콘을 위아래로 드래그하여 줄을 감아 올립니다.</li>
                                    <li><strong>인식 모드:</strong> 낚시 방식은 동일하나, 기기 내 전면 카메라로 자신의 모습을 확인하면서 물고기가 걸렸을 때 실제로 팔을 낚아채는 제스처를 취하고, 양손을 교대로 돌려 릴을 감는 신체 제스처를 취하여 시간 막대를 채워 낚아 올립니다.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 10. 이웃 사귀기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">10. 이웃 사귀기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 가상의 복지관 공간에서 만나는 다양한 이웃 주민들의 자기소개(이름, 취미, 직업 등)를 경청하여 기억한 뒤, 이웃에 관련된 정보 퀴즈를 맞추는 교류형 게임입니다. (자극 영역: 두정엽/언어력·판단력·순발력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">화면에 "새로운 복지관에 오신 걸 환영해요!" 멘트와 함께 이웃 캐릭터들이 차례로 등장합니다. 인물별 이름과 소개 내용(예: "이름: 박경호, 평일에 아파트 경비 일을 하십니다")을 주의 깊게 듣고 기억합니다. 소개가 모두 완료된 후 "평일에 아파트 경비일을 하시는 분은 누구신가요?"라는 문제가 출제되면 보기 중 알맞은 이름(박경호)을 선택하고 [정답확인]을 누릅니다.</p>
                            </div>
                        </div>
                    </div>

                    <div class="mb-8 border-b-2 border-slate-300 pb-4">
                        <h4 class="font-bold text-slate-800 flex items-center"><i data-lucide="layout-dashboard" class="w-6 h-6 mr-2 text-orange-600"></i> PART 2. 블록 게임 (인터랙티브 블록 연동 인지훈련 10종)</h4>
                        <p class="text-red-600 mt-2 font-bold">※ 모든 블록게임은 시작 전 화면 안내에 맞게 0번부터 9번 블록을 순서대로 일렬 배치한 후, 로봇 화면에서 [연결 확인] 버튼을 눌러 블루투스 연동을 마쳐야 시작할 수 있습니다.</p>
                    </div>
                    <div class="space-y-6 mb-8">
                        <!-- 1. 숫자 따라하기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">1. 숫자 따라하기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 로봇 스피커를 통해 들려주는 숫자 배열을 청각적으로 기억했다가, 블록의 LCD 화면에 표시된 숫자를 정방향 혹은 역방향 순서대로 터치하는 훈련입니다. (자극 영역: 측두엽/기억력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">로봇 화면에 "지금부터 들려드리는 숫자를 잘 듣고 기억해주세요"라는 안내와 함께 음성으로 숫자가 송출됩니다. 이후 화면에 "숫자를 찾아 순서대로 누르기" 지시가 뜨면, 들었던 숫자에 해당되는 물리 블록의 상단 액정 화면을 순서대로 손으로 터치(입력)한 후, 로봇 화면의 [정답 확인]을 누릅니다. (오입력 시 [지우기]로 수정 가능)</p>
                            </div>
                        </div>

                        <!-- 2. 숫자 순서찾기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">2. 숫자 순서찾기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 무작위 숫자가 적힌 공들이 화면에 나타나면, 난이도 및 규칙에 따라 작은 수부터 큰 수 순서(또는 반대 순서)대로 블록을 물리적으로 흔들거나 눌러서 지우는 게임입니다. (자극 영역: 측두엽/기억력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제: (1~5단계는 오름차순, 6~10단계는 내림차순 진행)</strong>
                                <ul class="list-disc ml-5 text-slate-700 space-y-2">
                                    <li><strong>노란색 공 예제:</strong> 화면과 블록에 노란색 바탕의 숫자 공이 나타나면, 순서에 해당하는 번호의 실제 블록 도구를 손으로 집어 들고 '위아래로 힘있게 찰칵 흔들었다가 내려놓는' 제스처를 취해 인식시킵니다.</li>
                                    <li><strong>파란색 공 예제:</strong> 화면과 블록에 파란색 숫자 공이 나타나면, 순서에 맞춰 해당 '블록의 상단 화면 영역을 손가락으로 가볍게 터치하여' 입력합니다.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 3. 빨리 찾아라 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">3. 빨리 찾아라</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 로봇 태블릿 화면에 특정 동물 지시어가 나타나면, 10개의 블록 액정 화면들을 빠르게 스캔하여 똑같은 그림이 출력되고 있는 블록을 찾아 번개처럼 터치하는 순발력 기반 기억력 게임입니다. (자극 영역: 측두엽/기억력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">로봇 태블릿 본체 화면에 "쥐를 잡아주세요!"라는 문구와 함께 쥐 그림이 나타납니다. 사용자는 일렬로 놓인 0~9번 블록들의 화면을 신속하게 쳐다보고, 내부 액정에 똑같은 '쥐' 그림이 깜빡이고 있는 블록을 찾아 그 블록 화면을 손가락으로 재빨리 터치하여 잡아냅니다.</p>
                            </div>
                        </div>

                        <!-- 4. 단어 만들기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">4. 단어 만들기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 각 블록에 흩어져서 표시되는 낱개의 한 글자(음절)들을 조합하여, 화면에 제시된 뜻에 맞는 온전한 낱말이 되도록 블록의 측면 마그네틱을 서로 물리적으로 결합(합체)시키는 언어 훈련입니다. (자극 영역: 두정엽/기억력·언어력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">로봇 화면에 단어 미션(예: "인구")이 출제됩니다. 사용자는 각 블록의 LCD 창을 확인하여 '인' 자가 적힌 블록과 '구' 자가 적힌 블록을 찾습니다. 두 블록을 손으로 집어 글자 순서에 맞게 좌우 측면을 탁 붙여서 물리적으로 조립한 뒤, 본체 화면의 [정답 확인]을 누릅니다.</p>
                            </div>
                        </div>

                        <!-- 5. 그림 맞추기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">5. 그림 맞추기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 태블릿 화면에 무작위 기호나 기하학적 도형 배치가 나타나면, 블록 액정에 나오는 수많은 기호 중 동일한 기호를 찾아 화면과 똑같은 형태 구조로 블록들을 도미노처럼 연결해 맞추는 훈련입니다. (자극 영역: 전두엽/계산력)</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 예제:</strong>
                                <p class="text-slate-700">로봇 화면에 왼쪽부터 [타원 - 하트 - 스페이드] 모양의 카드 배열이 예시로 표출됩니다. 블록 도구들 중 내부 화면에 타원, 하트, 스페이드 기호가 켜져 있는 블록들을 각각 색출해 냅니다. 찾아낸 블록들을 화면의 예시 기하 구조와 완벽히 일치하도록 순서대로 가로 결합하여 모양을 완성한 후 [정답 확인] 버튼을 누릅니다.</p>
                            </div>
                        </div>

                        <!-- 6. 기억 하기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2">6. 기억 하기</h4>
                            <p class="text-slate-600 mb-4"><strong>설명:</strong> 화면에 짧은 시간 동안 보여준 글자, 문양 및 그 기기가 놓인 위치를 뇌리에 기억했다가, 화면이 숨겨진 뒤 해당 블록을 누르거나 올바른 자리에 조합하는 고난도 단기 기억 훈련입니다. (자극 영역: 두정엽/계산력)</p>

                                    <li>정답일 경우 캐릭터가 물보라를 일으키며 해당 위치까지 직접 수영해 이동하고 +10점을 획득합니다. 오답일 때는 캐릭터가 반응하지 않고 정지한 상태에서 새로운 화살표 조합이 상단에 갱신됩니다.</li>
                                </ol>
                            </div>
                        </div>

                        <!-- 7. 청기백기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="flag" class="w-5 h-5 mr-2 text-blue-600"></i>7. 청기백기 (언어력 훈련)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 무작위 조건 청각 명령어 청취 후 지체 없이 청기와 백기의 상/하 제어 스위치를 누르는 전형적인 순발력 조건 판단 언어 게임입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>난이도 선택:</strong> 1단계(올려, 올리지 마 단순형)부터 3단계(둘 다 내리지 마 등 복잡 꼬임형 명령어)까지 구성되며, 총 30문항 세트로 진행됩니다.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ol class="list-decimal ml-5 text-slate-700 space-y-1">
                                    <li>기기 스피커에서 고음질의 청각 명령어(예: "청기 올리지 말고, 백기 올려!")가 카운트다운과 함께 송출됩니다.</li>
                                    <li>사용자는 3초의 극히 짧은 제한시간 이내에 화면 좌측(청기 제어 화살표) 영역과 우측(백기 제어 화살표) 영역의 위/아래 단추를 조합하여 터치합니다.</li>
                                    <li>누른 동작 내역은 화면 좌측 빈 슬롯에 타임라인 데이터로 실시간 마킹되며, 잘못 입력한 조작은 하단 [X] 단추를 눌러 즉시 삭제 수정할 수 있습니다.</li>
                                    <li>3초 타이머 바가 바닥나면 최종 제출 처리되며 정답일 시 훈련 꼬마 캐릭터가 만세를 부르며 맞춘 문제 개수가 1개 상승합니다.</li>
                                </ol>
                            </div>
                        </div>

                        <!-- 8. 단어 관람차 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="circle-dashed" class="w-5 h-5 mr-2 text-blue-600"></i>8. 단어 관람차 (언어력 훈련)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 뱅글뱅글 돌아가는 유원지 관람차에 매달린 글자 자소들을 시각 인지하여 단어 구조에 맞게 순차적으로 드래그 조립하는 텍스트 연상 게임입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>난이도 선택:</strong> 1단계(글자 수 3개 단어, 라이프 2개)부터 4단계(글자 수 6개 고급 어휘 단어, 라이프 5개, 텍스트 암막 가림막 효과 작동)까지 제공되며 3분의 제한시간이 흐릅니다.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ol class="list-decimal ml-5 text-slate-700 space-y-1">
                                    <li>화면에 대형 대관람차 기구가 우측 방향으로 서서히 로테이션 주행하며, 각 객차 캡슐마다 글자가 한 자씩 표기됩니다 (예: '유', '끼', '느', '다').</li>
                                    <li>연상되는 온전한 낱말(예: '느끼다')이 되도록 해당 글자 객차를 손가락으로 꾹 눌러 하단 정답 영역 빈칸 매트 안으로 순서대로 하나씩 드래그하여 끌어다 놓습니다.</li>
                                    <li>올바른 정답 단어 음절을 하나 도킹시킬 때마다 실시간으로 +1점을 추가 확보합니다.</li>
                                    <li>엉뚱한 결합으로 오답을 입력하면 좌측 상단의 빨간 풍선(라이프)이 1개 펑 터지며 정답 힌트 한 글자를 알려줍니다. 풍선이 전부 다 소진되면 전체 점수에서 -1점이 삭감되고, 화면에 "관람차 재정비 중"이라는 비상 배너가 출력되며 5초 동안 모든 조작이 강제 동결되므로 감점을 주의해야 합니다.</li>
                                    <li>(심화 요소): 난이도 2단계부터는 일정 궤도를 돌면 객차의 글자들이 물음표나 블라인드로 가려지는 방해요소가 발동되므로, 최초 관람차 진입 시 눈에 띄는 글자 좌표들을 미리 속사로 암기해야 수월합니다.</li>
                                </ol>
                            </div>
                        </div>

                        <!-- 9. 병아리 세기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-blue-600"></i>9. 병아리 세기 (수리력 훈련)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 둥지에 들어앉은 암탉의 품 안을 빠르게 기어 들어갔다 기어 나오는 병아리 마릿수를 트래킹하여 덧셈/뺄셈 연산으로 최종 개수를 도출하는 연산 수리 게임입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>난이도 선택:</strong> 1단계(품속으로 진입하는 병아리만 존재 [+]), 2단계(진입 후 다시 탈출하는 병아리 발생 [-]), 3단계(동시 다발적으로 진입 및 이탈 복합 구성 [+, -])로 전개되며 3분의 제한시간이 배정됩니다.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ol class="list-decimal ml-5 text-slate-700 space-y-1">
                                    <li>중앙의 하얀 암탉 캐릭터의 꼬리, 날개, 밑단 방향에서 노란색 아기 병아리들이 쫑쫑 걸어 나와 닭 품속으로 들어가 안 보입니다. 사용자는 집중해서 눈으로 병아리 가감 유출입 동향을 셉니다.</li>
                                    <li>출현 시퀀스가 종료되면 하단 제어판에 알모양 숫자 카운터와 함께 [+](더하기), [-](빼기) 버튼이 활성화됩니다.</li>
                                    <li>버튼을 조작하여 머릿속으로 계산해 둔 최종 병아리 잔여 수량(예: 7마리)을 입력창에 정확히 맞춘 후, 우측의 빨간색 [입력 완료] 큰 단추를 클릭합니다 (주어진 라운드 풀이 시간 1분이 지나면 당시 입력된 숫자로 자동 강제 전송됨).</li>
                                    <li>제출과 동시에 어미 닭이 깜짝 놀라 날개짓하며 화면 오른쪽으로 날아가고, 둥지 바닥에 남아 삐약거리는 실제 병아리 수 정답이 투명하게 정산 공개됩니다. 정답 일치 시 +1점이 지표에 반영됩니다.</li>
                                </ol>
                            </div>
                        </div>

                        <!-- 10. 숫자 접시 가져오기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="calculator" class="w-5 h-5 mr-2 text-blue-600"></i>10. 숫자 접시 가져오기 (수리력 훈련)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 회전식 콘베이어 벨트를 타고 끝없이 굴러가는 숫자 접시의 사칙연산 문제를 스캔하여 계산기로 정답 단추를 입력해 낚아채는 연산 속도 훈련 게임입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>난이도 선택:</strong> 1단계(한 자리 수의 단순 덧/뺄셈)부터 3단계(한/두 자리 혼합 가감승제 덧셈·뺄셈·곱셈·나눗셈 종합 연산)까지 지원되며 타임아웃 제한 시간은 3분입니다.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ol class="list-decimal ml-5 text-slate-700 space-y-1">
                                    <li>상단 회전 레일 가이드에 수식 텍스트(예: '15 - 6', '4 + 9')가 또렷하게 인쇄된 사기그릇 접시들이 최대 10개까지 대열을 맞춰 순환 회전합니다.</li>
                                    <li>회전하는 접시 중 마음에 드는 연산 문제 접시를 타깃으로 낙점하고 신속히 암산합니다 (예: '15 - 6 = 9').</li>
                                    <li>하단 중앙의 가상 디지털 계산기 물리 키패드(1~0) 단추를 터치하여 연산 정답 스칼라 값(9)을 기재합니다. 글자를 오타 냈을 땐 좌측 분홍색 [삭제] 단추를 누르면 지워집니다.</li>
                                    <li>정답 수치가 세팅된 것을 확인한 뒤 우측 하단 빨간색 [입력] 버튼을 확실하게 눌러 예제를 마감합니다.</li>
                                    <li>정답인 경우: 회전하던 해당 문제 접시 테두리에 반짝이 이펙트가 일어나며 내 개인 접시 적재함으로 쏙 연출 이송 처리되고 점수가 증가합니다. (점수 획득 기준은 난이도 단계별 비례: 1단계 1점, 2단계 2점, 3단계 3점 지급).</li>
                                    <li>오답인 경우: 현재 레일 위에 전혀 존재하지 않는 임의의 황당한 정답 값을 기재해 전송하면, 디지털 계산기 액정에 붉은색 자막으로 'ERROR' 경고가 대문짝만하게 점멸 표출되며 연산에 실패하게 됩니다.</li>
                                </ol>
                            </div>
                        </div>

                        <!-- 11. 다함께 분리수거 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="trash-2" class="w-5 h-5 mr-2 text-blue-600"></i>11. 다함께 분리수거 (판단력 훈련)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 무작위 쓰레기 기호 중 하단에 출현하는 환경 자원 수거함 종류에 부합하는 타깃만 정확하게 낚아채 골라내는 상황 판단력 기반 분류 게임입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>난이도 선택:</strong> 1단계(분류 쓰레기 보기 4개, 일반 표준 재활용품 구성), 2단계(분류 쓰레기 보기 6개, 재활용 불가능한 일반 쓰레기 및 음식물 오브젝트가 결합한 교란 패턴)로 코스가 구성되며 제한 시간은 1분 혹은 1분 30초입니다.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ol class="list-decimal ml-5 text-slate-700 space-y-1">
                                    <li>기기 디스플레이 한복판에 원형 궤도를 그리며 음료수 빈 캔, 주스 유리병, 종이 골판지 박스 등 각종 폐기물 일러스트 아이콘들이 반시계 방향으로 서서히 공전 회전합니다.</li>
                                    <li>하단 쓰레기통 입구 수거함 박 가이드에 특정 분리수거 명칭 표지판이 랜덤하게 활성화됩니다 (예: '종이', '유리').</li>
                                    <li>현재 수거함 이름(예: '유리')에 호응하는 적합한 회전 오브젝트(예: 사이다 초록색 유리병)를 시각적으로 빠르게 검출하여 손가락으로 붙잡고 하단 붉은색 수거함 통 내부 구멍 공간 안으로 드래그하여 드롭(투척) 시킵니다.</li>
                                    <li>올바른 매칭 투하로 정답 처리가 되면 쓰레기 분류 처리를 처리한 순발력 속도 게이지에 비례하여 미세하게 산정된 판정 점수가 가중 부여됩니다 (최소 1점부터 초고속 분류 시 최고 10점 한도 배정). 다음 문항으로 래핑되며 하단 수거함의 자원 카테고리 속성이 동적으로 자동 리셋됩니다.</li>
                                    <li>만약 캔이나 종이를 유리 수거함에 던져 넣는 오답 분류를 하면 불합격 소리와 함께 해당 쓰레기 그림이 튕겨 나와 원래 돌던 원형 공전 자전 궤도로 자석처럼 복귀해 버립니다.</li>
                                </ol>
                            </div>
                        </div>

                        <!-- 12. 소리 연결하기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="volume-2" class="w-5 h-5 mr-2 text-blue-600"></i>12. 소리 연결하기 (판단력 훈련)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 복수의 사물 동전들이 차례로 출력하는 고유 사운드 효과음의 선후 인과 관계 순서 시퀀스를 정밀하게 청취 청각 기억한 후, 올바른 인덱스 순서대로 역추적하여 조립하는 청각 지각 판단력 게임입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>난이도 선택:</strong> 1단계(출제 소리 동전 수 2개), 2단계(소리 동전 수 3개), 3단계(최대 고난도 소리 동전 수 4개 중복 결합)로 편제되어 있으며 전체 제한 타이머는 5분입니다.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ol class="list-decimal ml-5 text-slate-700 space-y-1">
                                    <li>칠판 테이블 보드 위에 특유의 삽화가 입혀진 대형 금속 주화 문제 동전(귀뚜라미 문양, 생쥐 문양, 옛날 다이얼 전화기 문양, 파도 물소리 문양 등)들이 넓게 분산 배치됩니다.</li>
                                    <li>시스템에서 "각 동전 소리를 기억해 주세요" 멘트와 함께, 배치된 동전 하나하나가 순차적으로 점멸 하이라이트 발광하며 매칭된 리얼 동물/사물 효과음(예: 찌르르 귀뚜라미 소리, 따르릉 전화 벨소리)을 시연 송출합니다.</li>
                                    <li>사전 시연이 완수되면, 시스템이 이 효과음들의 순서를 마구 뒤섞어 콤보 묶음으로 스피커를 통해 들려줍니다 (예: 1번째로 '전화기 벨소리' -> 2번째로 '귀뚜라미 소리' -> 3번째로 '생쥐 찍찍 소리' 출력).</li>
                                    <li>소리 출력이 끝나면 사용자는 청각 기억을 복원하여 방금 들은 콤보 오디오 순서 그대로 하단 정답 벨트 위의 실제 은화 동전 그래픽들을 차례차례 터치합니다.</li>
                                    <li>동전을 터치하면 누른 역사적 흐름에 맞춰 동전 알맹이 정중앙에 '1', '2', '3' 이라는 물리적 조작 순서 인덱스 자막 번호가 찍히며 마킹됩니다 (한 번 누른 터치 인덱스는 부분 교정 및 무르기가 차단되므로 심사숙고해야 합니다).</li>
                                    <li>최종 정산 시스템이 개입하여 정답 순서열과 비교 분석을 실행하며, 정확한 자리에 올바른 소리 동전을 명중시킨 건수마다 동전 한 개당 +1점씩 점수 보상을 인색하지 않게 정산 지급합니다.</li>
                                </ol>
                            </div>
                        </div>
                    </div>

                    <div class="mb-8 border-b-2 border-slate-300 pb-4">
                        <h4 class="font-bold text-slate-800 flex items-center"><i data-lucide="users" class="w-6 h-6 mr-2 text-indigo-600"></i> PART 2. 멀티 게임 (네트워크 기반 2인 이상 대결형 3종)</h4>
                    </div>

                    <div class="space-y-6 mb-8">
                        <!-- 1. 온라인 맞고놀이 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="users" class="w-5 h-5 mr-2 text-indigo-600"></i>1. 온라인 맞고놀이 (Go-Stop 대전)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 대한민국 시니어 계층에게 익숙한 정통 화투 맞고의 룰과 연출을 완벽하게 모바일 네트워크 환경으로 이식하여 타 사용자와 점수내기 경쟁을 벌이는 멀티플레이어 보드게임 채널입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>진행 요령:</strong> 평균 15분~20분 소요.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ul class="list-disc ml-5 text-slate-700 space-y-2">
                                    <li><strong>룸 입장 및 매칭 단계:</strong> 사용자 인적 사항 등록 선택창에서 현재 로그인 중인 자신의 닉네임 프로필(예: 방문자 1) 버튼을 터치해 방에 입장한 뒤 대기합니다. 시스템이 '친구를 찾는 중' 이라는 네트워크 로딩 바를 띄우며 15초의 제한시간 동안 매칭 상대를 서칭합니다. 제한시간 내에 상대가 조인하면 '친구찾기 성공' 팝업과 함께 3초 후 대국실이 즉시 오픈됩니다 (실패 시 다시하기를 눌러 재시도 가능).</li>
                                    <li><strong>패 분배 및 선 결정:</strong> 인공지능 호스트가 난수 알고리즘을 가동하여 선(First attack 선공) 유저를 랜덤하게 추첨해 지정한 후, 양측 사용자 손패 매트 위로 각각 화투패를 10장씩 공평하게 자동 배포 분할합니다.</li>
                                    <li><strong>화투패 착수 및 가이드:</strong> 본인의 턴이 돌아와 시간 제한 바가 차오르면, 현재 내 10장의 패 중 바닥에 깔린 화투 더미와 일치하는 같은 달(월)의 화투패를 골라 터치해 바닥에 출하 착수시킵니다. 이때 초보 및 약시 시니어를 위한 편의 기능으로, 바닥패와 매칭이 가능한 유효 적합 손패 상단 영역에 파란색 및 회색 안내용 화살표 표식을 UI 상에 띄워 주므로 편하게 조작할 수 있습니다.</li>
                                    <li><strong>고/스톱 권한 행사 및 엔딩:</strong> 화투판을 진행하다가 먹은 패 점수의 합산 가치가 먼저 '7점' 기준선에 도달한 사용자가 탄생하는 순간, 화면 중앙에 웅장한 목조 고 단추와 스톱 아이콘 팝업이 활성화되며 권한 행사를 독촉합니다. 한쪽이 과감하게 '스톱'을 누르거나, 스톱이 없는 상태에서 양측 유저의 손패 10장이 전량 제로(0)로 바닥나 소진되면 대국이 공식 종료됩니다.</li>
                                    <li><strong>통계 결과 창 대조:</strong> 대국 엔딩과 동시에 스크린 전체에 '승리' 혹은 '패배' 엠블럼이 박히며, 플레이어가 최종 획득한 고스톱 점수 수치(예: 총 140점 획득), 게임 머니 판정 결과, 그리고 이번 라운드를 치열하게 전개한 정밀 '놀이한 시간' 로그가 일목요연하게 표출되므로 확인 후 마감 단추를 누르면 퇴장 처리됩니다.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 2. 온라인 오목두기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="grid" class="w-5 h-5 mr-2 text-indigo-600"></i>2. 온라인 오목두기 (오목 대전)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 가로, 세로, 대각선 격자선 방향을 불문하고 바둑판 교차점 위에 자신의 바둑돌을 빈틈없이 연속해서 일렬로 정확히 5개를 늘어세우는 유저가 다이렉트로 판정승을 거두는 전통 대결형 멀티 보드게임입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>진행 요령:</strong> 평균 15분~20분 소요.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ul class="list-disc ml-5 text-slate-700 space-y-2">
                                    <li>맞고 채널과 일치하는 매칭 서칭 가이드라인을 거쳐 대국실 바둑판 매트에 입장하면 시스템이 흑돌/백돌 진영을 매칭 완료해 줍니다.</li>
                                    <li>오목 정통 법식에 의거하여 흑돌(Black) 진영을 배정받은 사용자부터 선공으로 낙점되어 첫 단추 턴을 개시하며, 한 수당 주어지는 생각 제한시간 타이머는 차례 당 딱 30초입니다.</li>
                                    <li>나무 바둑판 격자 줄 교차점 공간 중 원하는 좌표를 손가락으로 가볍게 터치하면, 오조작 방지를 위해 해당 자리에 파란색 가상 돌 허상 가이드가 마킹되어 표출됩니다. 착수 위치가 타당하다고 판단되면 내 프로필 명패 하단에 위치한 사각형 회색 [완료] 확정 버튼을 눌러 돌을 완전히 바둑판 위에 안착 고정시킵니다. 만약 장고를 거듭하다 30초 타임아웃 제한 시간을 초과해 넘겨버리면, 빈 바둑판 격자점 좌표 중 시스템이 연산한 임의의 무작위 빈자리에 돌이 강제로 착수되어 상대에게 턴이 강제 패스되니 타이머 관리에 주의해야 합니다.</li>
                                    <li><strong>(특수 로컬 룰):</strong> 해피태블릿 오목 엔진은 시니어 친화 오락 목적이 강하므로 흑돌의 3-3(쌍삼)이나 4-4 착수를 시스템 제어로 전면 금지하거나 규제하지 않으므로 자유롭게 공격 전술을 구사할 수 있습니다. 다만 돌을 6개 이상 일렬로 길게 엮어버리는 '육목 이상의 장목' 행마는 바둑판에 둘 수는 있지만, 최종 오목 합격 승리 마크 조건 스케줄러에는 포함되지 않으므로 무조건 딱 정밀한 '5목'을 완성하도록 정위치 타격에 집중해야 합니다.</li>
                                    <li>한쪽이 철벽 방어를 뚫고 일렬 5목 정렬 레이아웃을 성공하는 찰나 게임 엔진이 휘슬을 울리며 라운드가 공식 종료됩니다. 승리한 대국자 닉네임 우측 상단 지표에 황금빛 '1등 왕관 훈장 메달 아이콘'이 새겨지며 승패 결과지 및 총 대국 시간 리포트가 오버레이 팝업으로 표출됩니다.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 3. 온라인 장기두기 -->
                        <div class="border-2 border-slate-200 p-5 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-2 flex items-center"><i data-lucide="sword" class="w-5 h-5 mr-2 text-indigo-600"></i>3. 온라인 장기두기 (장기 대전)</h4>
                            <p class="text-slate-600 mb-2"><strong>설명:</strong> 대한민국 표준 장기 협회 규격 표준 룰셋을 기반으로 코딩된 디지털 전략 보드게임 채널로, 한나라/초나라 진영의 고유 장기 기물(차, 포, 마, 상, 사, 졸/병)들을 정해진 궤도 법칙대로 제어 행마 하여 상대방 최고의 총사령관 왕인 '궁'을 외통수로 고립시켜 사살포획하면 승리하는 고난도 전략 퍼즐 멀티 콘텐츠입니다.</p>
                            <p class="text-slate-600 mb-4"><strong>진행 요령:</strong> 평균 15분~20분 소요.</p>
                            <div class="bg-slate-50 p-4 rounded border border-slate-100">
                                <strong class="text-slate-800 block mb-2">▶ 진행 및 조작 예제:</strong>
                                <ul class="list-disc ml-5 text-slate-700 space-y-2">
                                    <li><strong>맞춤식 상차림 선택 단계:</strong> 매칭 하이웨이를 통과해 장기판 배틀 필드방에 들어서면, 본격 대국 스위치를 올리기 직전 화면 하단에 30초 카운트다운 타이머와 함께 4가지 기본 포진 선택창이 팝업됩니다. 사용자는 자신의 장기 기풍과 전략 시나리오에 걸맞은 상차림 유형(마상상마, 상마마상, 마상마상, 상마상마 등 귀마/원앙마/면상 커스텀 배치) 중 하나를 마우스 터치로 신속히 선택한 후 빨간색 [놀이 시작] 승인 단추를 터치합니다 (30초 동안 초조하게 고민하다 기권하거나 시간 초과 시 시스템이 디폴트로 세팅해 놓은 자동 기본형 포진 상차림으로 대국이 반강제 강제 개시됩니다).</li>
                                    <li><strong>보정 기본 기물 점수 부가 규칙:</strong> 한국 표준 민속 장기 철칙 중 하나인 '한나라 후공 보정 점수(비김수 방지용 1.5점)' 규정이 기계적으로 반영됩니다. 대국 시작선에서 양 진영의 스코어보드 기물 점수가 푸른색 초나라 진영은 선공 권한 부여와 함께 순수 기물 점수 총합인 '72점', 붉은색 한나라 진영은 후공 핸디캡 보정 1.5점이 산입된 '73.5점'으로 차등 마킹된 상태에서 초나라의 첫 한 수 착수로 장기판이 열립니다.</li>
                                    <li><strong>기물 터치 조작 및 한 턴 제한시간:</strong> 판 위에 일렬 배치된 내 아군 장기 말 중 하나(예: 차 [車])를 손가락으로 가볍게 터치 클릭하면, 장기판 내 격자선 위로 해당 말이 법도상 진격 또는 후퇴할 수 있는 모든 유효 이동 가능 좌표 칸들마다 푸른색 점 및 화살표 안내 가이드 아이콘이 친절하게 불을 밝힙니다. 그중 전략상 적합한 타깃 목적지 좌표를 지정해 터치하면 장기 말이 해당 칸으로 스르륵 전술 이동을 완료하며 상대에게 턴을 양도합니다 (한 턴당 작전 구상 제한시간은 30초이며, 30초 내에 아무 조작도 안 하고 패스하면 내 귀중한 주력 기물 중 하나가 무작위 인공지능 연산에 의해 엉뚱한 곳으로 강제 자동 행마 처리되므로 신속히 터치해야 합니다).</li>
                                    <li><strong>행마 제약 프로토콜 및 장군 신호탄:</strong> 대국 도중 바둑판을 오가며 동일한 형태의 악의적 장기 말 반복 전술 행마(예: 차를 올렸다 내렸다 무한 반복하는 행위)를 연속 3회 이상 단행하면 시스템이 트롤링 반칙으로 규정하여 3회 이상 반복수를 원천 금지 차단시킵니다. 만약 내 행마의 결과로 인해 다음 차례 턴에 상대방의 우두머리 '궁(왕)' 기물을 무조건 직격 체포할 수 있는 킬각(체크메이트 외통 전 단계)이 완성되면, 장기판 정중앙에 붉은색 대형 자막으로 "장군"이라는 경고 경보 이펙트 레이아웃이 실시간 점멸 마킹되어 양 대국자에게 시각적으로 통보해 줍니다.</li>
                                    <li><strong>적장 포획 및 기물 점수 스코어 정산:</strong> 내 장기 말의 전진 궤적 상에 위치한 적군의 말(예: 상대방 포 [包])을 덮쳐 잡아내면, 해당 적군 기물 그래픽이 장기판에서 증발하여 화면 양옆 스크린 레이아웃 영역에 구비된 '잡은 말 정보 보관함 상자' 슬롯으로 정렬 수집됩니다. 기물을 손실당한 유저는 대한민국 표준 장기 점수 가치 규정(차 13점, 포 7점, 마 5점, 상 및 사 3점, 졸 및 병 2점) 계산식 가중치 수치에 의거해 실시간으로 내 프로필 점수 계기판에서 해당 점수만큼이 뚝 깎여 차감 실점 처리되므로 실시간 기물 점수 밸런스를 육안으로 검증할 수 있습니다.</li>
                                    <li><strong>대국 엔딩 및 판정승 조건문:</strong> 기포와 차를 활용해 상대방 궁의 사방 도망 길을 완전히 차단하는 완벽한 '외통수' 작전을 성공하여 상대 왕을 먼저 생포 포획해 내는 순간 장기 대국은 내 승리로 공식 클리어 마감됩니다. 만약 양 유저 모두 수비 위주의 신중한 철벽 방어 장고 대국을 펼치느라 장기판 우측 상단에 카운트되는 전체 장기 제한 수인 '200수(200/200)' 제한 한도를 모두 소진해 채울 때까지도 상대 왕을 잡지 못했을 경우, 시스템이 대국 강제 중지 명령을 발동합니다. 그 중단 시점에 양측 스코어보드 전광판에 남겨진 '최종 기물 잔여 점수(예: 한나라 49.5점 vs 초나라 52점)' 수치 기록을 하드웨어 호스트가 상호 크로스 대조 연산하여 단 0.5점이라도 점수가 더 높은 진영 유저에게 판정승 승리 왕관 마크를 부여하고 게임을 엄격하게 결산 종료합니다.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                                    `
            },
            {
                id: 'wifi',
                title: '공공 와이파이 연결 방법',
                icon: 'wifi',
                content: `
                    <h2>공공기관 무료 와이파이 (Public WiFi Free) 연결 안내</h2>
                    <p class="mb-6 text-slate-600">어르신들의 데이터 요금 부담을 덜어드리기 위해 체험존 및 공공기관에서 제공하는 무료 인터넷 연결 방법입니다.</p>

                    <div class="flex flex-col md:flex-row gap-6 mb-6">
                        <div class="flex-1 bg-white p-5 rounded-lg border border-slate-200 shadow-sm">

                                <li>부채꼴 모양의 <strong class="text-blue-700">Wi-Fi(와이파이) 아이콘을 길게</strong> 누릅니다.</li>
                                <li>주변 네트워크 목록에서 <span class="highlight font-bold text-blue-700">Public WiFi Free</span>를 찾아 터치합니다.</li>
                                <li>연결된 <span class="highlight font-bold text-blue-700">Public WiFi Free</span>를 다시 한번 더 터치해 연결을 완료합니다.</li>

                            <ol class="list-decimal ml-5 space-y-3 text-slate-700">
                                <li>스마트폰 바탕화면에서 톱니바퀴 모양의 <strong class="text-slate-800">'설정'</strong> 앱을 누릅니다.</li>
                                <li><strong class="text-blue-700">'Wi-Fi'</strong> 메뉴를 누르고 스위치를 켭니다.</li>
                                <li>네트워크 목록에서 <span class="highlight font-bold text-blue-700">Public WiFi Free</span>를 찾아 터치합니다.</li>
                                <li>안내 창이 열리면 <strong class="text-blue-800">[공공와이파이 이용하기]</strong> 버튼을 누르고, 오른쪽 위의 '완료'를 누릅니다.</li>
                            </ol>
                        </div>
                    </div>

                    <div class="bg-red-50 p-5 rounded-lg border border-red-200 mt-6">
                        <h3 class="text-red-800 font-bold mb-3"><i data-lucide="alert-triangle" class="inline w-6 h-6 mb-1 mr-1"></i> 데이터 사용 시 주의사항</h3>
                        <ul class="list-disc ml-5 space-y-2 text-slate-700">
                            <li>공공 와이파이는 여러 사람이 함께 쓰는 통신망이므로 보안에 다소 취약할 수 있습니다.</li>
                            <li><strong class="text-red-700">은행 업무(스마트폰 뱅킹)나 비밀번호 입력 등 중요한 개인정보를 다룰 때는 공공 와이파이 사용을 피하시고 가급적 본인의 데이터를 사용해 주세요.</strong></li>
                            <li>더욱 안전한 <span class="highlight font-bold">Public WiFi Secure</span> 망을 이용하실 경우, 연결 시 아이디와 비밀번호에 모두 영문 소문자로 <strong>wifi</strong>를 입력하시면 됩니다.</li>
                        </ul>
                    </div>
                `
            }
        ];

const menuList = document.getElementById('menuList');
        const contentArea = document.getElementById('contentArea');
        const desktopSearch = document.getElementById('desktopSearch');
        const mobileSearch = document.getElementById('mobileSearch');
        const sidebar = document.getElementById('sidebar');
        const fontScaleDisplay = document.getElementById('fontScaleDisplay');
        const mainContent = document.getElementById('mainContent');

        function renderIcons() { lucide.createIcons(); }

        let highlights = [];
        let currentHighlightIndex = -1;

        function highlightText(html, keyword) {
            if (!keyword.trim()) return html;
            const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp("(?![^<]*>)(" + escapedKeyword + ")", "gi");
            return html.replace(regex, "<mark class='search-highlight bg-yellow-300 text-slate-900 px-1 rounded shadow-sm'>$1</mark>");
        }

        function renderMenu(dataToRender, keyword = '') {
            menuList.innerHTML = ''; 
            
            if (dataToRender.length === 0) {
                menuList.innerHTML = '<p class="text-center text-slate-500 mt-10 text-sm md:text-base">검색 결과가 없습니다.</p>';
                return;
            }

            const sortedData = dataToRender.sort((a, b) => {
                if (a.id === 'setup') return -1;
                if (b.id === 'setup') return 1;
                if (a.id === 'cleanup') return -1;
                if (b.id === 'cleanup') return 1;
                return 0;
            });

            sortedData.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 md:p-4 mb-2 rounded-xl flex items-center font-semibold text-slate-700 hover:bg-blue-50 hover:text-blue-700 transition-colors border border-transparent hover:border-blue-100';
                btn.innerHTML = `
                    <i data-lucide="${item.icon}" class="w-5 h-5 md:w-6 md:h-6 mr-3 text-slate-400 shrink-0"></i> 
                    <span class="text-base md:text-lg truncate">${item.title}</span>
                `;
                btn.onclick = () => {
                    document.querySelectorAll('#menuList button').forEach(b => {
                        b.classList.remove('bg-blue-100', 'text-blue-800', 'border-blue-200');
                        const icon = b.querySelector('svg, i');
                        if (icon) {
                            icon.classList.remove('text-blue-600');
                            icon.classList.add('text-slate-400');
                        }
                    });
                    btn.classList.add('bg-blue-100', 'text-blue-800', 'border-blue-200');
                    const activeIcon = btn.querySelector('svg, i');
                    if (activeIcon) {
                        activeIcon.classList.remove('text-slate-400');
                        activeIcon.classList.add('text-blue-600');
                    }
                    
                    showContent(item, keyword);

                    // [개선] 모바일/태블릿 화면(너비 768px 미만)일 경우, 메뉴 선택 후 목차 자동 숨김 처리
                    if (window.innerWidth < 768) {
                        if (!sidebar.classList.contains('sidebar-hidden')) {
                            toggleSidebar();
                        }
                    }
                };
                menuList.appendChild(btn);
            });
            renderIcons();
        }

        function showContent(item, keyword = '') {
            let contentHtml = item.content;
            if (keyword) contentHtml = highlightText(contentHtml, keyword);
            contentArea.innerHTML = contentHtml;
            renderIcons();
            
            if (keyword) {
                highlights = Array.from(document.querySelectorAll('.search-highlight'));
                if (highlights.length > 0) {
                    currentHighlightIndex = 0;
                    document.getElementById('searchNavigator').classList.remove('hidden');
                    updateHighlightUI();
                } else {
                    document.getElementById('searchNavigator').classList.add('hidden');
                    // [개선] 콘텐츠 로드 시 본문 맨 위로 부드럽게 자동 스크롤
                    mainContent.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } else {
                document.getElementById('searchNavigator').classList.add('hidden');
                // [개선] 콘텐츠 로드 시 본문 맨 위로 부드럽게 자동 스크롤
                mainContent.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updateHighlightUI() {
            if (highlights.length === 0) return;
            highlights.forEach(el => el.classList.remove('active'));
            const activeEl = highlights[currentHighlightIndex];
            activeEl.classList.add('active');
            document.getElementById('searchMatchCount').innerText = (currentHighlightIndex + 1) + " / " + highlights.length;
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function nextHighlight() {
            if (highlights.length === 0) return;
            currentHighlightIndex = (currentHighlightIndex + 1) % highlights.length;
            updateHighlightUI();
        }

        function prevHighlight() {
            if (highlights.length === 0) return;
            currentHighlightIndex = (currentHighlightIndex - 1 + highlights.length) % highlights.length;
            updateHighlightUI();
        }

        function clearSearch() {
            document.getElementById('desktopSearch').value = '';
            document.getElementById('mobileSearch').value = '';
            document.getElementById('searchNavigator').classList.add('hidden');
            renderMenu(manualData);
            
            contentArea.innerHTML = `
                <div class="text-center py-16 md:py-20 text-slate-500">
                    <i data-lucide="pointer" class="w-12 h-12 md:w-16 md:h-16 mx-auto mb-4 text-slate-300"></i>
                    <p class="text-xl md:text-2xl font-bold mb-2">목차에서 매뉴얼을 선택해주세요.</p>
                    <p class="text-base md:text-lg">또는 검색창에서 기기 이름을 검색해 보세요.</p>
                </div>
            `;
            renderIcons();
            
            document.querySelectorAll('#menuList button').forEach(b => {
                b.classList.remove('bg-blue-100', 'text-blue-800', 'border-blue-200');
                const icon = b.querySelector('svg, i');
                if (icon) {
                    icon.classList.remove('text-blue-600');
                    icon.classList.add('text-slate-400');
                }
            });

            // 검색 취소 시 모바일에서는 목차를 다시 열어주어 빠른 탐색 유도
            if (window.innerWidth < 768 && sidebar.classList.contains('sidebar-hidden')) {
                toggleSidebar();
            }
        }

        function handleSearch(e) {
            const rawKeyword = e.target.value;
            const keywordLower = rawKeyword.trim().toLowerCase();
            
            desktopSearch.value = rawKeyword;
            mobileSearch.value = rawKeyword;

            const filteredData = manualData.filter(item => {
                return item.title.toLowerCase().includes(keywordLower) || 
                       item.content.toLowerCase().includes(keywordLower);
            });

            renderMenu(filteredData, rawKeyword.trim());

            if (keywordLower !== '' && filteredData.length > 0) {
                menuList.querySelector('button').click();
            } else if (keywordLower === '') {
                clearSearch();
            }
        }

        let currentFontScale = 1;
        function changeFontSize(change) {
            currentFontScale += change;
            if (currentFontScale < 0.8) currentFontScale = 0.8;
            if (currentFontScale > 1.6) currentFontScale = 1.6;
            document.documentElement.style.setProperty('--font-scale', currentFontScale);
            fontScaleDisplay.innerText = Math.round(currentFontScale * 100) + '%';
        }

        function toggleSidebar() {
            sidebar.classList.toggle('sidebar-hidden');
            
            const sidebarText = document.getElementById('sidebarText');
            const sidebarIcon = document.getElementById('sidebarIcon');
            const mobileSidebarToggleBtn = document.getElementById('mobileSidebarToggleBtn');

            if (sidebar.classList.contains('sidebar-hidden')) {
                sidebarText.innerText = "목차표시";
                sidebarIcon.setAttribute("data-lucide", "panel-left-open");
                mobileSidebarToggleBtn.innerText = "목차표시";
            } else {
                sidebarText.innerText = "목차숨김";
                sidebarIcon.setAttribute("data-lucide", "panel-left-close");
                mobileSidebarToggleBtn.innerText = "목차숨김";
            }
            renderIcons();
        }

        function toggleFullScreen() {
            const elem = document.documentElement;
            const btn = document.getElementById('fullscreenToggleBtn');
            const fullscreenText = document.getElementById('fullscreenText');
            const fullscreenIcon = document.getElementById('fullscreenIcon');

            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                fullscreenIcon.setAttribute("data-lucide", "minimize");
                fullscreenText.innerText = "창화면";
                btn.title = "창화면";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                fullscreenIcon.setAttribute("data-lucide", "maximize");
                fullscreenText.innerText = "전체화면";
                btn.title = "전체화면 전환";
            }
            renderIcons();
        }

        desktopSearch.addEventListener('input', handleSearch);
        mobileSearch.addEventListener('input', handleSearch);

        renderMenu(manualData);
        renderIcons();

    </script>
